# This application embeds APScheduler, so keep a single replica until the
# scheduler is externalized or protected by leader election.
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: harbor.jay-gemini.com/library/jay-blog-be
  pullPolicy: Always
  tag: latest

imagePullSecrets:
  - name: harbor-creds

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

containerPort: 8000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

env:
  POSTGRES_SERVER: postgresql-dev-primary.data.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: firebat
  POSTGRES_SCHEMA: jay_blog
  POSTGRES_USER: devdb
  TZ: Asia/Seoul
  CORS_ORIGINS: '["https://jay-gemini.com"]'
  DATABASE_ECHO: "false"
  SCHEDULER_ENABLED: "true"
  RUN_INITIAL_ANALYSIS: "false"
  SCHEDULER_TIMEZONE: Asia/Seoul

secretEnv:
  - name: POSTGRES_PASSWORD
    secretName: jay-blog-be-secrets
    secretKey: POSTGRES_PASSWORD
  - name: DART_API_KEY
    secretName: jay-blog-be-secrets
    secretKey: DART_API_KEY
  - name: KRX_ID
    secretName: jay-blog-be-secrets
    secretKey: KRX_ID
  - name: KRX_PW
    secretName: jay-blog-be-secrets
    secretKey: KRX_PW

startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

volumes:
  - name: tmp
    emptyDir: {}
  - name: opendart-cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: opendart-cache
    mountPath: /app/docs_cache
