ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: api.jay-gemini.com
      paths:
        - path: /
          pathType: Prefix
  # TLS is terminated by the host Nginx before traffic reaches Traefik.
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
