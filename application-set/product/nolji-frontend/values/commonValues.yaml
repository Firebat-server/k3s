image:
  repository: harbor.jaystacks.com/library/nolji-frontend-nextjs-app
  pullPolicy: IfNotPresent

# Replace with the Kubernetes docker-registry secret name for Harbor when needed.
# imagePullSecrets:
#   - name: harbor-registry
imagePullSecrets: []

serviceAccount:
  create: false
  automount: false

podSecurityContext:
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

service:
  type: ClusterIP
  port: 3000

env:
  NEXT_PUBLIC_WORDPRESS_URL: "https://minoooo119.com/wp-json/wp/v2"
  NEXT_PUBLIC_SITE_URL: "https://minoooo119.com"
  PORT: "3000"

# Secret은 레포에 두지 않고 클러스터에 직접 만듭니다 (product 네임스페이스).
# kubectl create secret generic nolji-frontend-secrets -n product --from-literal=GEMINI_API_KEY=<key>
secretEnv:
  - name: GEMINI_API_KEY
    secretName: nolji-frontend-secrets
    secretKey: GEMINI_API_KEY

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
