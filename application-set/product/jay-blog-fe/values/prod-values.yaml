ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: jaystacks.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.jaystacks.com
      paths:
        - path: /
          pathType: Prefix
  # TLS is terminated by the host Nginx before traffic reaches Traefik.
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Keep public HTTPS URLs/TLS validation while server-side WordPress fetches
# use this single-node origin instead of making a round trip through the CDN.
hostAliases:
  - ip: "172.30.1.79"
    hostnames:
      - jaystacks.com
