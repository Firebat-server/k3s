apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sunsun-be.fullname" . }}
  labels:
    {{- include "sunsun-be.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sunsun-be.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sunsun-be.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: be-db-secrets
                  key: db-password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health  # 표준 health check 경로 사용
              port: 8080              # 포트 번호 명시 (애플리케이션 포트)
            initialDelaySeconds: 60   # 애플리케이션 구동 시간을 고려해 조금 늘림
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health  # 표준 health check 경로 사용
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}