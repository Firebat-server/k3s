replicaCount: 1

image:
  repository: jmangel3404/sunsun-fe
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: d-sunsun.jaystacks.com
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  NEXT_PUBLIC_API_URL: "https://d-sunsun-api.jaystacks.com"

imageUpdater:
  enabled: true
  updateStrategy: digest
  writeBackMethod: argocd
