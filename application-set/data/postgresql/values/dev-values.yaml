## Bitnami PostgreSQL Helm Chart Values
architecture: replication

global:
  defaultStorageClass: "postgresql-dev-pv"

auth:
  existingSecret: "postgresql-secret"
  secretKeys:
    adminPasswordKey: "postgres-password"
    userPasswordKey: "password"
    replicationPasswordKey: "replication-password"
  database: "firebat"
  username: "devdb"

primary:
  name: "primary"
  persistence:
    enabled: true
    existingClaim: "postgresql-dev-master-pvc"
    volumeName: "data"
    size: 5Gi
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

readReplicas:
  replicaCount: 1
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: "postgresql-dev-pv"
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    selector:
      matchLabels:
        db-role: replica

volumePermissions:
  enabled: true
  containerSecurityContext:
    runAsUser: 0
    privileged: true