## Bitnami PostgreSQL Helm Chart Values
global:
  defaultStorageClass: "postgresql-dev-pv"

auth:
  # 1. Secret 이름 변경
  existingSecret: "postgresql-secret"

  # Secret 내의 키 매핑 (kubectl 명령어에서 사용한 키와 일치해야 함)
  secretKeys:
    adminPasswordKey: "postgres-password"
    userPasswordKey: "password"
    replicationPasswordKey: "replication-password"

  database: "firebat"
  username: "devdb"

primary:
  fullnameOverride: "postgres-primary"
  persistence:
    enabled: true
    volumeName: "data"
    size: 5Gi
    existingClaim: "postgresql-dev-master-pvc"
    storageClass: "postgresql-dev-pv"
    accessModes:
      - ReadWriteOnce
    selector:
      matchLabels:
        type: local
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

readReplicas:
  replicaCount: 1
  persistence:
    enabled: true
    size: 5Gi
    existingClaim: ""
    storageClass: "postgresql-dev-pv"
    selector:
      matchLabels:
        db-role: replica
    accessModes:
      - ReadWriteOnce

