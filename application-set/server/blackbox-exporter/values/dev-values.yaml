chartConfig:
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: prometheus-blackbox-exporter
  targetRevision: 11.15.1
destinationNamespace: monitoring

image:
  tag: v0.28.0

replicas: 1
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

service:
  type: ClusterIP
  port: 9115

ingress:
  enabled: false

config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        valid_status_codes:
          - 200
          - 201
          - 202
          - 204
          - 301
          - 302
          - 307
          - 308
        follow_redirects: true
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    http_health_2xx:
      prober: http
      timeout: 5s
      http:
        valid_status_codes:
          - 200
        follow_redirects: false
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    dns_jay_gemini:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: jay-gemini.com
        query_type: A

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      monitoring_jay_gemini_com_enabled: "true"
    interval: 30s
    scrapeTimeout: 10s
  enabled: true
  defaults:
    labels:
      monitoring_jay_gemini_com_enabled: "true"
    interval: 30s
    scrapeTimeout: 15s
    module: http_2xx
  # Kept in values/targets.yaml so real endpoints have a separate review path.
  targets: []

prometheusRule:
  enabled: false

networkPolicy:
  enabled: false
