chartConfig:
  repoURL: https://grafana.github.io/helm-charts
  chart: alloy
  targetRevision: 1.10.1
destinationNamespace: monitoring

global:
  podSecurityContext:
    # Host Nginx logs are root:www-data:adm 0640 on Ubuntu.
    supplementalGroups:
      - 4

image:
  tag: v1.17.1

controller:
  type: daemonset
  terminationGracePeriodSeconds: 30
  volumes:
    extra:
      - name: alloy-data
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File
      - name: geoip-city
        hostPath:
          path: /srv/monitoring/geoip
          type: Directory

alloy:
  enableReporting: false
  enableHttpServerPort: true
  listenAddr: 0.0.0.0
  storagePath: /var/lib/alloy
  mounts:
    varlog: true
    # Existing systemd Promtail remains the Docker log collector during overlap.
    # Enabling this now would duplicate Docker streams in Loki.
    dockercontainers: false
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
      - name: geoip-city
        mountPath: /etc/alloy-geoip
        readOnly: true
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          regex         = "(.+)/(.+)"
          replacement   = "/var/log/pods/*$1/$2/*.log"
          target_label  = "__path__"
        }
      }

      loki.source.file "pod_logs" {
        targets       = discovery.relabel.pod_logs.output
        forward_to    = [loki.process.pod_logs.receiver]
        tail_from_end = true
        file_match {
          enabled     = true
          sync_period = "10s"
        }
      }

      loki.process "pod_logs" {
        stage.cri {}
        stage.static_labels {
          values = {
            cluster = "k3s-jay",
            source  = "kubernetes",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      // During the overlap, systemd Promtail continues to send this file to
      // Docker Loki while Alloy tails only new lines into K3s Loki.
      loki.source.file "nginx_access" {
        targets = [{
          __path__  = "/var/log/nginx/access.log",
          cluster   = "k3s-jay",
          entrypoint = "home-mini-proxy nginx",
          host      = "home-mini-proxy",
          job       = "nginx_access",
          node      = sys.env("HOSTNAME"),
          source    = "host-nginx",
        }]
        forward_to    = [loki.process.nginx_access.receiver]
        tail_from_end = true
        file_match {
          enabled     = true
          sync_period = "10s"
        }
      }

      loki.process "nginx_access" {
        stage.json {
          expressions = {
            body_bytes_sent       = "body_bytes_sent",
            http_referer          = "http_referer",
            http_user_agent       = "http_user_agent",
            remote_addr           = "remote_addr",
            request_method        = "request_method",
            request_time          = "request_time",
            request_uri           = "request_uri",
            server_name           = "server_name",
            status                = "status",
            upstream_addr         = "upstream_addr",
            upstream_response_time = "upstream_response_time",
            upstream_status       = "upstream_status",
          }
        }

        stage.geoip {
          source  = "remote_addr"
          db      = "/etc/alloy-geoip/GeoLite2-City.mmdb"
          db_type = "city"
        }

        stage.labels {
          values = {
            geoip_city_name          = "",
            geoip_country_code       = "",
            geoip_country_name       = "",
            geoip_location_latitude  = "",
            geoip_location_longitude = "",
            server_name              = "",
            status                   = "",
            upstream_addr            = "",
          }
        }

        stage.match {
          selector = "{upstream_addr=\"100.86.114.43:80\"}"
          stage.static_labels {
            values = {route_runtime = "lab_server"}
          }
        }
        stage.match {
          selector = "{upstream_addr=\"127.0.0.1:30080\"}"
          stage.static_labels {
            values = {route_runtime = "server_k3s"}
          }
        }
        stage.match {
          selector = "{job=\"nginx_access\", upstream_addr=\"\"}"
          stage.static_labels {
            values = {route_runtime = "edge_or_redirect"}
          }
        }
        stage.match {
          selector = "{job=\"nginx_access\", upstream_addr!=\"\", upstream_addr!=\"100.86.114.43:80\", upstream_addr!=\"127.0.0.1:30080\"}"
          stage.static_labels {
            values = {route_runtime = "server_docker"}
          }
        }

        // Loki derives service_name from job; retaining both wastes a stream
        // label and can exceed the default 15-label limit once GeoIP is added.
        stage.label_drop {
          values = ["service_name"]
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.relabel "journal" {
        forward_to = [loki.write.local.receiver]
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal_syslog_identifier"]
          target_label  = "syslog_identifier"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
      }

      loki.source.journal "system" {
        path    = "/var/log/journal"
        max_age = "24h"
        labels = {
          cluster = "k3s-jay",
          job     = "systemd-journal",
          node    = sys.env("HOSTNAME"),
          source  = "journal",
        }
        forward_to = [loki.relabel.journal.receiver]
      }

      loki.source.kubernetes_events "cluster" {
        job_name   = "kubernetes-events"
        log_format = "logfmt"
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

configReloader:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    monitoring_jay_gemini_com_enabled: "true"
  interval: 30s

ingress:
  enabled: false
