apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infisical-redis.fullname" . }}
  labels:
    {{- include "infisical-redis.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.client.serviceAccountName }}
  labels:
    {{- include "infisical-redis.labels" . | nindent 4 }}
# Infisical itself does not need a Kubernetes API token for this installation.
automountServiceAccountToken: false
