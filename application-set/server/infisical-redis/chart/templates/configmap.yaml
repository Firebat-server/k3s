apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infisical-redis.fullname" . }}-config
  labels:
    {{- include "infisical-redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    dir /data
    appendonly yes
    appendfsync everysec
    save ""
    maxmemory 256mb
    # Infisical background jobs must not be silently evicted.
    maxmemory-policy noeviction
