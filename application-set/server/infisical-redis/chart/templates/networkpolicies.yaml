apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "infisical-redis.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "infisical-redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.client.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-ingress
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.client.podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
