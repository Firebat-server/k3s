chartConfig:
  repoURL: https://serhanekicii.github.io/openclaw-helm
  chart: openclaw
  targetRevision: 1.3.18

app-template:
  # 1. ConfigMode: merge는 런타임 변경사항(예: 페어링된 기기 등)을 유지합니다.
  configMode: "merge"

  ingress:
    main:
      enabled: true
      className: traefik
      hosts:
        - host: openclaw.jay-gemini.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http

  # 2. Main 컨트롤러 환경변수 설정
  controllers:
    main:
      containers:
        main:
          envFrom:
            - secretRef:
                name: openclaw-env-secret
          env:
            # Ollama API 주소를 환경변수로 명시 (OpenClaw가 LiteLLM/OpenAI 호환 포맷을 사용할 경우를 대비)
            OLLAMA_API_BASE: "http://ollama.ollama.svc.cluster.local:11434"
            OPENAI_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434/v1"

  # 3. OpenClaw 핵심 설정 (openclaw.json)
  configMaps:
    config:
      enabled: true
      data:
        "openclaw.json": |-
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "trustedProxies": ["10.42.0.100"] // k3s의 Traefik 등 프록시 IP를 정확히 입력하세요 (CIDR 미지원)
            },
            "browser": {
              "enabled": true,
              "defaultProfile": "default",
              "profiles": {
                "default": {
                  "cdpUrl": "http://localhost:9222",
                  "color": "#4285F4"
                }
              }
            },
            "agents": {
              "defaults": {
                "workspace": "/home/node/.openclaw/workspace",
                "model": {
                  "primary": "ollama/llama3.1"
                },
                "userTimezone": "Asia/Seoul",
                "timeoutSeconds": 600,
                "maxConcurrent": 1
              },
              "list": [
                {
                  "id": "dev-assistant",
                  "default": true,
                  "identity": {
                    "name": "DevPro",
                    "emoji": "🧠",
                    "description": "코딩, AI 개발 및 일정 관리를 돕는 전문 비서입니다."
                  },
                  "prompt": "너는 숙련된 풀스택 개발자이자 AI 엔지니어, 그리고 꼼꼼한 프로젝트 매니저야. 코딩 시에는 Clean Code 원칙을 준수하고, 일정 관리 시에는 우선순위를 명확히 해줘."
                }
              ]
            },
            "tools": {
              "profile": "full",
              "web": {
                "search": { "enabled": true },
                "fetch": { "enabled": true }
              }
            },
            "session": {
              "scope": "per-sender",
              "store": "/home/node/.openclaw/sessions",
              "reset": {
                "mode": "idle",
                "idleMinutes": 60
              }
            },
            "logging": {
              "level": "info",
              "consoleLevel": "info",
              "consoleStyle": "compact",
              "redactSensitive": "tools"
            }
          }

  # 4. Network Policy (매우 중요)
  # OpenClaw 내부에서 Ollama로의 통신을 허용하기 위해 이그레스(Egress) 규칙을 설정해야 합니다.
  networkpolicies:
    main:
      enabled: false
