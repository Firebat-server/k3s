chartConfig:
  repoURL: https://serhanekicii.github.io/openclaw-helm
  chart: ollama
  targetRevision: 1.40.0

ollama:
  gpu:
    enabled: false

  models:
    - llama3.1
    - gemma2:9b

persistentVolume:
  enabled: true
  size: 50Gi

resources:
  requests:
    cpu: "2"           # 최소 2코어 확보
    memory: "4Gi"      # 최소 4GB 램
  limits:
    cpu: "4"           # 최대 4코어까지 사용 (라이젠 5 성능 활용)
    memory: "24Gi"     # 32GB 중 다른 Pod를 위해 8GB 남기고 최대 24GB 할당

ingress:
  enabled: true
  hosts:
    - host: ollama.jay-gemini.com
      paths:
        - path: /
          pathType: Prefix

