apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: application-set
  namespace: server
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: "https://github.com/Firebat-server/k3s.git"
        revision: HEAD
        files:
          - path: "application-set/*/*/values/*-values.yaml"
  template:
    metadata:
      name: >-
        {{- $app := index .path.segments 2 -}}
        {{- $fileId := .path.filename | replace ".yaml" "" | replace "-values" "" -}}
        {{- $app -}}-{{- $fileId -}}
      labels:
        env: '{{ .path.filename | replace "-values.yaml" "" }}'
        team: "{{ index .path.segments 1 }}"
      annotations:
        # Explicit-destination apps (the monitoring stack) keep chart/image pins
        # and therefore expose an empty image-updater list.
        argocd-image-updater.argoproj.io/image-list: >-
          {{- if .destinationNamespace -}}{{- "" -}}{{- else -}}myimg=harbor.jay-gemini.com/library/{{ index .path.segments 2 }}{{- end -}}
        argocd-image-updater.argoproj.io/myimg.update-strategy: digest
        argocd-image-updater.argoproj.io/write-back-method: argocd
        argocd-image-updater.argoproj.io/myimg.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/myimg.helm.image-tag: image.tag
    spec:
      project: default
      sources:
        - repoURL: >-
            {{- .chartConfig.repoURL | default "https://github.com/Firebat-server/k3s.git" -}}
          targetRevision: '{{ .chartConfig.targetRevision | default "HEAD" }}'
          chart: '{{ .chartConfig.chart | default "" }}'
          path: >-
            {{- if .chartConfig.chart -}}
              {{- "" -}}
            {{- else -}}
              {{- .chartConfig.path | default (printf "application-set/%s/%s/chart" (index .path.segments 1) (index .path.segments 2)) -}}
            {{- end -}}

          helm:
            ignoreMissingValueFiles: true
            parameters:
              - name: envName
                value: '{{ .path.filename | replace ".yaml" "" | replace "-values" "" }}'
            valueFiles:
              - "$values/application-set/{{ index .path.segments 1 }}/{{ index .path.segments 2 }}/values/commonValues.yaml"
              - "$values/application-set/{{ index .path.segments 1 }}/{{ index .path.segments 2 }}/values/{{ .path.filename }}"
              - "$values/application-set/{{ index .path.segments 1 }}/{{ index .path.segments 2 }}/values/targets.yaml"
              - '{{- if and (eq (index .path.segments 1) "product") (eq (index .path.segments 2) "nolji-frontend") (eq .path.filename "prod-values.yaml") -}}$argocd-deploy-values/application-set/{{ index .path.segments 1 }}/{{ index .path.segments 2 }}/cicd-auto-values/{{ .path.filename }}{{- else -}}$values/__ignored__/missing-values.yaml{{- end -}}'
        
        - repoURL: https://github.com/Firebat-server/k3s.git
          targetRevision: HEAD
          ref: values

        - repoURL: https://github.com/Firebat-server/charts-deploy-values.git
          targetRevision: HEAD
          ref: argocd-deploy-values

      destination:
        server: https://kubernetes.default.svc
        # Monitoring definitions live under application-set/server, while their
        # workloads can explicitly target the dedicated monitoring namespace.
        namespace: '{{ .destinationNamespace | default (index .path.segments 1) }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Large Prometheus Operator CRDs exceed client-side apply's annotation
          # limit. Enable SSA only for apps with an explicit destination namespace.
          - '{{- if .destinationNamespace -}}ServerSideApply=true{{- else -}}Validate=true{{- end -}}'
