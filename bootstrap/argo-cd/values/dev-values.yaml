namespaceOverride: "server"

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: "argocd.jay-gemini.com"
    paths:
      - /

configs:
  params:
    server.insecure: true

argocd-image-updater:
  enabled: true
  config:
    registries:
      - name: Harbor
        api_url: https://harbor.jay-gemini.com
        prefix: harbor.jay-gemini.com
        ping: yes
        credentials: pullsecret:server/harbor-creds
    logLevel: info
