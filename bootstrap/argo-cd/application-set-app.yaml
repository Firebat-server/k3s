apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-application-set
  namespace: server
spec:
  project: default
  source:
    repoURL: https://github.com/Firebat-server/k3s.git
    targetRevision: main
    path: bootstrap/argo-cd
    directory:
      recurse: false
      include: application-set.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
