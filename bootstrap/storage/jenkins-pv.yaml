# pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-dev-pv
  labels:
    type: local
spec:
  storageClassName: jenkins-dev-pv # 1. 이 이름을 PVC와 맞춰주어야 합니다.
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/srv/k3s/data/jenkins"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - jay
